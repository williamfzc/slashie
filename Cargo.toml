[package]
name = "slashie"
version = "0.2.0"
edition = "2021"
description = "Send a slash command in Feishu, run it locally, reply with the outcome."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macOS shell (tray + Settings window), gated behind the `tray` feature so a
# pure headless artifact excludes the GUI dependency graph at build time.
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(unix)'.dependencies]
# Signal installation and process-group termination (src/main.rs, src/process.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Console-control handler so Ctrl+C drains like the Unix signal path (src/main.rs).
ctrlc = "3"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
# Prevents App Nap from suspending the polling runtime while the menu bar app
# has no visible window (see src/app/mod.rs).
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["NSProcessInfo", "NSString"] }

[features]
default = []
tray = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:objc2-foundation"]

[[bin]]
name = "slashie"
path = "src/main.rs"
