name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-headless:
    # Headless artifact: GUI dependencies must be absent from the graph
    # (DESIGN.md "Desktop build"); Linux builds without a display session.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Documentation structure
        run: python3 scripts/check_docs.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (strict)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Tests (locked)
        run: cargo test --locked --no-default-features
      - name: Headless release build
        run: cargo build --release --locked --no-default-features
      - name: No GUI dependencies in the headless graph
        run: |
          set -o pipefail
          cargo tree --locked --no-default-features --edges normal,build \
            | tee /tmp/headless-tree.txt
          if grep -Eiq 'tauri|rfd' /tmp/headless-tree.txt; then
            echo "GUI dependency found in headless graph" >&2
            exit 1
          fi

  macos-tray:
    # macOS shell: tray feature build and the full test suite (DESIGN.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (strict, tray)
        run: cargo clippy --locked --all-targets --features tray -- -D warnings
      - name: Tests (locked, tray)
        run: cargo test --locked --features tray
      - name: Tray release build
        run: cargo build --release --locked --features tray
      - name: Headless build also succeeds on macOS
        run: cargo build --release --locked --no-default-features

  macos-package:
    # Bundle the macOS .app on main so every push ships an installable
    # artifact (DESIGN.md "Desktop build" artifacts table).
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify the dependency lock
        run: cargo build --locked --features tray
      - name: Install tauri-cli (pinned, prebuilt via npm)
        run: |
          npm install -g @tauri-apps/cli@2.12.5
          cargo tauri --version
      - name: Bundle the .app
        run: cargo tauri build --features tray --bundles app
      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Slashie-macos
          path: target/release/bundle/macos/Slashie.app
