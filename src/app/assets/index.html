<!doctype html>
<!-- Settings view for the macOS host: a read-only mirror of the live
     configuration. Every edit goes through the slashie CLI; this window
     reflects config.json and the runtime state as they are. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slashie Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      --background: #f5f5f7;
      --surface: #fff;
      --ink: #202124;
      --secondary: #5f636a;
      --line: #d7d7dc;
      --accent: #005fce;
      --error: #ac211e;
      --ok: #34a853;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #242426;
        --surface: #303033;
        --ink: #f2f2f4;
        --secondary: #b9b9bf;
        --line: #545459;
        --accent: #83b9ff;
        --error: #ff9b91;
        --ok: #6dd58c;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--background); color: var(--ink); }
    main { display: flex; flex-direction: column; gap: 14px; height: 100dvh; padding: 20px; overflow: auto; }
    p { margin: 0; }
    button { font: inherit; min-height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); padding: 4px 10px; }
    button:enabled { cursor: pointer; }
    button:enabled:hover { border-color: var(--secondary); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .55; }
    .runtime-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--secondary);
      font-size: 12px;
    }
    #runtime-dot {
      flex-shrink: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--line);
    }
    #runtime-dot.on { background: var(--ok); }
    #runtime-dot.scanning { animation: breathe 1s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #runtime-dot.scanning { animation: none; }
    }
    #account-line { color: var(--secondary); font-size: 12px; }
    .config label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 6px;
    }
    #config-text {
      margin: 0;
      max-height: 240px;
      overflow: auto;
      font: 11px/16px ui-monospace, Menlo, monospace;
      white-space: pre;
      user-select: all;
    }
    .hint { color: var(--secondary); font-size: 12px; }
    .hint code {
      padding: 1px 5px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      user-select: all;
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: auto;
      border-top: 1px solid var(--line);
      padding: 10px 0 0;
    }
    #agent-hint { color: var(--secondary); font-size: 11px; }
    .error { color: var(--error); font-size: 12px; overflow-wrap: anywhere; }
    #error:not(:empty) {
      border: 1px solid var(--error);
      border-radius: 8px;
      padding: 8px 10px;
    }
  </style>
</head>
<body>
  <main>
    <p id="error" class="error" role="alert"></p>
    <!-- Read-only runtime status; intentionally not a live region so the
         one-second refresh stays quiet for screen readers. -->
    <p id="runtime-status" class="runtime-status">
      <span id="runtime-dot" aria-hidden="true"></span>
      <span id="runtime-text">Checking the poller…</span>
    </p>
    <p id="account-line" hidden></p>

    <section class="config" aria-labelledby="config-title">
      <label id="config-title">config.json</label>
      <pre id="config-text" tabindex="0" aria-label="Configuration file contents"></pre>
    </section>

    <footer>
      <div class="footer-group">
        <button id="edit-config" type="button">Edit Config</button>
        <button id="open-log" type="button" disabled>Open Log</button>
        <span id="log-error" class="error" role="alert"></span>
      </div>
      <span id="agent-hint">An agent can manage this configuration too — just point it at the slashie CLI.</span>
    </footer>
  </main>

  <script>
    // `__TAURI__` requires `withGlobalTauri`; the internals bridge is always
    // injected, so Settings still works if the global API is unavailable.
    const invoke =
      window.__TAURI__?.core?.invoke?.bind(window.__TAURI__.core) ??
      window.__TAURI_INTERNALS__?.invoke?.bind(window.__TAURI_INTERNALS__);
    const error = document.getElementById("error");
    const runtimeDot = document.getElementById("runtime-dot");
    const runtimeText = document.getElementById("runtime-text");
    const configText = document.getElementById("config-text");
    const accountLine = document.getElementById("account-line");
    const openLog = document.getElementById("open-log");
    const editConfig = document.getElementById("edit-config");
    const logError = document.getElementById("log-error");

    function renderRuntimeStatus(runtime) {
      if (runtime.status_text) {
        runtimeDot.classList.remove("on", "scanning");
        runtimeText.textContent = runtime.status_text;
      } else if (!runtime.polling) {
        runtimeDot.classList.remove("on", "scanning");
        runtimeText.textContent = "Paused";
      } else if (runtime.scanning) {
        runtimeDot.classList.add("on", "scanning");
        runtimeText.textContent = "Scanning…";
      } else if (runtime.next_scan_in_secs != null) {
        runtimeDot.classList.add("on");
        runtimeDot.classList.remove("scanning");
        runtimeText.textContent = `Next scan in ${Math.max(1, runtime.next_scan_in_secs)}s`;
      } else {
        runtimeDot.classList.add("on");
        runtimeDot.classList.remove("scanning");
        runtimeText.textContent = "Scanning…";
      }
    }

    function renderSettings(settings) {
      openLog.disabled = !settings.log_available;
      accountLine.hidden = !settings.identity;
      accountLine.textContent = settings.identity
        ? `Account ${settings.identity} · ${settings.identity_status}`
        : "";
      // The mirror shows the file as it is, valid or not; the banner only
      // explains why the runtime is ignoring it.
      configText.textContent = settings.config_text || "(empty)";
      const banner = settings.config_unparsable
        ? "config.json cannot be parsed. Fix the file and this mirror reloads by itself."
        : "";
      // Touch the alert only on change so screen readers are not
      // re-announced every second.
      if (error.textContent !== banner) error.textContent = banner;
    }

    let failureReported = false;

    function reportFailureOnce(message) {
      // The window has no console; report a broken connection to the log
      // once per failure episode so it is observable (menu-bar.md).
      if (failureReported) return;
      failureReported = true;
      try {
        Promise.resolve(invoke?.("report_settings", { message })).catch(() => {});
      } catch {
        // Nothing more we can do without the bridge.
      }
    }

    async function refresh() {
      if (document.hidden || typeof invoke !== "function") return;
      try {
        const [runtime, settings] = await Promise.all([
          invoke("get_status"),
          invoke("get_settings"),
        ]);
        failureReported = false;
        renderRuntimeStatus(runtime);
        renderSettings(settings);
      } catch (failure) {
        runtimeDot.classList.remove("on", "scanning");
        const message = `Status unavailable. ${failure.message ?? failure}`;
        runtimeText.textContent = message;
        reportFailureOnce(message);
      }
    }
    setInterval(refresh, 1000);
    refresh();

    openLog.onclick = async () => {
      logError.textContent = "";
      try {
        await invoke("open_log");
      } catch (failure) {
        logError.textContent = `Could not open the log. ${failure.message ?? failure}`;
      }
    };

    editConfig.onclick = async () => {
      logError.textContent = "";
      try {
        await invoke("edit_config");
      } catch (failure) {
        logError.textContent = `Could not open an editor. ${failure.message ?? failure}`;
      }
    };
  </script>
</body>
</html>
